id: bug-context-researcher
title: Bug Context Researcher
status: ready
summary: Adds concise repo-aware triage context to newly created bugs and regressions on the selected issue platform.
readiness: adapt-before-use
showOnWebsite: true
showInDashboard: true
fit:
  jobsToBeDone:
    - operate
    - explain
  bestFor:
    - Teams that receive bug reports in GitHub Issues or Linear and want fast context before manual triage.
    - Issue workflows where titles, descriptions, labels, and linked repository evidence provide useful triage signals.
  notFor:
    - Teams that want Charlie to assign, prioritize, close, or otherwise manage bug lifecycle state automatically.
    - Issues that require customer-private logs or production access that Charlie cannot inspect safely.
requirements:
  requiredIntegrations: []
  optionalIntegrations: []
  other:
    - The integration for the selected issue platform must be connected and configured for the repository.
    - Issue titles, descriptions, or labels contain enough signal to distinguish likely bugs from other work.
adaptations:
  - key: issue_platform
    label: Issue platform
    description: Choose exactly GitHub Issues or Linear as the issue system where this daemon should discover bugs and post triage comments.
    required: true
    suggestions:
      - GitHub Issues
      - Linear
specializationIdeas:
  - Add Sentry, support-ticket, or incident-system lookup steps when bug reports commonly include those references.
  - Specialize bug signals around team-specific labels or issue templates.
  - Add a standard missing-reproduction checklist used by the team.
